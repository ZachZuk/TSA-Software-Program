<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Rajdhani:300&display=swap");
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Helvetica", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("fieldd.jpeg");
            background-size: cover;
            background-position: center;
        }

        .glass-container {
            position: absolute;
            width: 80%;
            max-width: 70em;
            height: 70%;
            max-height: 45em;
            padding: 2em;
            background: rgba(220, 220, 220, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
        }

        .title {
            /* font-family: 'Times New Roman', Times, serif; */
            padding-top: 3%;
            padding-bottom: 3%;
            padding-left: 6%;
            padding-right: 7%;
            text-align: center;
            margin-left: 18%;
            margin-right: 25%;
            margin-top: 0.2em;
            width: 50%;
            font-weight: bold;
            font-size: 4em;
            margin-bottom: 0.8em;
            border-radius: 0.5em;
            background-color: rgba(105, 125, 155, 0.3);
        }

        .dropdown {
            padding: 0.5em;
            padding-top: 0.2em;
            padding-bottom: 0.29em;
            border-radius: 0.8em;
            margin-bottom: 0.3em;
            width: 12em;
            font-size: 1.2em;
            font-family: sans-serif;
            font-weight: 550;
            color:rgb(41, 68, 85);
            background-color: lightblue;
            box-shadow: 0 0 15px 3px rgba(173, 216, 230, 0.744), 0 0 30px 20px rgba(99, 131, 154, 0.3) inset;
            border-color: lightblue;
            transition: box-shadow 0.17s;
        }

        .dropdown:hover {
            box-shadow: 0 0 5px 2px rgba(173, 216, 230, 0.744), 0 0 30px 20px rgba(99, 131, 154, 0.4) inset;
            transition: box-shadow 0.17s;
        }

        .inside {
            background-color: rgb(247, 248, 234);
            font-family:'Times New Roman', Times, serif;
        }
        
        .box {
            width: 25em;
            margin: auto;
            margin-top: 0.3em;
            margin-bottom: 2em;
            padding: 4em;
            height: 12em;
            background-color: rgb(244, 248, 238);
            border-radius: 1.5em;
            border: 0.2em solid black;
            box-sizing: border-box;
        }

        .caption {
            color:rgba(0, 0, 0, 0.4);
            font-size: 1.2em;
        }

        .nav {
            position: absolute;
            justify-content: space-between;
            display: flex;
            top: 0;
            right: 0;
            margin: 8px;
            border-width: 5px;
            gap: 0.5em;
            padding: 0.4em;
            padding-left: 0.6em;
            padding-right: 0.6em;
            border-radius: 0.8em;
            background: rgba(220, 220, 220, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        .nav a {
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4em;
            border-radius: 0.5em;
            text-decoration: none;
            font-weight: bold;
            color: white;
        }

        .nav a:hover {
            background: rgba(0, 0, 0, 0.45);
        }

        .button {
            height: 2.1em;
            width: 7em;
            background-color: #0082c3;
            color: white;
            padding: 0.2em;
            border: none;
            cursor: pointer;
            font-size: 2.5em;
            font-weight: bolder;
            font-family: Helvetica, sans-serif;
            border-radius: 5em;
            box-shadow: 0 0 20px 5px rgb(37, 61, 76);
            text-shadow: 0 0 2px 10px black;
            transition: box-shadow 0.17s;
        }

        .button:hover {
            box-shadow: 0 0 10px 3px rgb(29, 79, 109), 0 0 10px 40px rgba(149, 195, 228, 0.2) inset;
            transition: box-shadow 0.17s;
        }

    </style>
</head>
<body>
    <div class="glass-container">
        <h1 class="title">Diagnose</h1>
        <select class="dropdown" id="plant-dropdown">
            <option class="inside">Select Plant Type</option>
            <option class="inside">Apple</option>
            <option class="inside">Cherry</option>
            <option class="inside">Corn</option>
            <option class="inside">Grape</option>
            <option class="inside">Peach</option>
            <option class="inside">Bell Pepper</option>
            <option class="inside">Potato</option>
            <option class="inside">Strawberry</option>
            <option class="inside">Tomato</option>
        </select>
        <div class="box">
            <input type="file" id="file-input" accept="image/*" style="display: none;" />
            <label for="file-input">
                <p class="caption">Drag and drop or select image</p>
            </label>
        </div>
        <button class="button" id="diagnose-button">Diagnose</button>
    </div>
    <div class="nav">
        <a class="home" href="home.html">Home</a>
        <a class="about" href="about.html">About</a>
    </div>
</body>
<script src="app.js"></script>
</html>
