<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets title and icon -->
    <title>Diagnose</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        /* Imports Google Fonts */
        @import url("https://fonts.googleapis.com/css?family=Rajdhani:300&display=swap");
        
        /* Reset body and html margin/padding with default font */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Helvetica", sans-serif;
        }

        /* Center everything in body and make background image fullscreen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://stacyknows.com/wp-content/uploads/2022/07/pexels-jahoo-clouseau-388415-scaled.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Centers glass container on the page */
        .glass-container {
            position: absolute;
            width: 80%;
            max-width: 70em;
            height: 70%;
            max-height: 45em;
            padding: 2em;
            background: rgba(220, 220, 220, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
        }

        /* Title element styling */
        .title {
            /* font-family: 'Times New Roman', Times, serif; */
            padding-top: 3%;
            padding-bottom: 3%;
            padding-left: 6%;
            padding-right: 7%;
            text-align: center;
            margin-left: 18%;
            margin-right: 25%;
            margin-top: 0.2em;
            width: 50%;
            font-weight: bold;
            font-size: 4em;
            margin-bottom: 0.8em;
            border-radius: 0.5em;
            background-color: rgba(105, 125, 155, 0.3);
        }

        /* Styles Dropdown Menu */
        .dropdown {
            padding: 0.5em;
            padding-top: 0.2em;
            padding-bottom: 0.29em;
            border-radius: 0.8em;
            margin-bottom: 0.3em;
            width: 12em;
            font-size: 1.2em;
            font-family: sans-serif;
            font-weight: 550;
            color:rgb(41, 68, 85);
            background-color: lightblue;
            box-shadow: 0 0 15px 3px rgba(173, 216, 230, 0.744), 0 0 30px 20px rgba(99, 131, 154, 0.3) inset;
            border-color: lightblue;
            transition: box-shadow 0.17s;
        }

        /* Creates the dropdown hover effect */
        .dropdown:hover {
            box-shadow: 0 0 5px 2px rgba(173, 216, 230, 0.744), 0 0 30px 20px rgba(99, 131, 154, 0.4) inset;
            transition: box-shadow 0.17s;
        }

        .inside {
            background-color: rgb(247, 248, 234);
            font-family:'Times New Roman', Times, serif;
        }
        
        /* Centers the image selection box in the glass container */
        .box {
            width: 25em;
            margin: auto;
            margin-top: 0.3em;
            margin-bottom: 2em;
            padding: 4em;
            height: 12em;
            background-color: rgb(244, 248, 238);
            border-radius: 1.5em;
            border: 0.2em solid black;
            box-sizing: border-box;
        }

        /* Styles the text to be centered in the image selection box */
        .caption {
            color:rgba(0, 0, 0, 0.4);
            font-size: 1.2em;
        }

        /* Nav bar styling*/
        .nav {
            position: absolute;
            justify-content: space-between;
            display: flex;
            top: 0;
            right: 0;
            margin: 8px;
            border-width: 5px;
            gap: 0.5em;
            padding: 0.4em;
            padding-left: 0.6em;
            padding-right: 0.6em;
            border-radius: 0.8em;
            background: rgba(220, 220, 220, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Styling links inside nav bar */
        .nav a {
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4em;
            border-radius: 0.5em;
            text-decoration: none;
            font-weight: bold;
            color: white;
        }

        /* Hover effect for nav buttons */
        .nav a:hover {
            background: rgba(0, 0, 0, 0.45);
        }

        /* Button styling */
        .button {
            height: 2.1em;
            width: 7em;
            background-color: #0082c3;
            color: white;
            padding: 0.2em;
            border: none;
            cursor: pointer;
            font-size: 2.5em;
            font-weight: bolder;
            font-family: Helvetica, sans-serif;
            border-radius: 5em;
            box-shadow: 0 0 20px 5px rgb(37, 61, 76);
            text-shadow: 0 0 2px 10px black;
            transition: box-shadow 0.17s;
        }

        /* Creates the button hover effect */
        .button:hover {
            box-shadow: 0 0 10px 3px rgb(29, 79, 109), 0 0 10px 40px rgba(149, 195, 228, 0.2) inset;
            transition: box-shadow 0.17s;
        }

        /* Styleing for the loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            position: relative;
            margin: 100px auto;
        }

        /* Styles the bouncing circles in the loading spinner*/
        .double-bounce1, .double-bounce2 {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #333;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.6;
            animation: bounce 2.0s infinite ease-in-out;
        }

        /* Creates an alternating effect for the bouncing balls*/
        .double-bounce2 {
            animation-delay: -1.0s;
        }

        /* Defines the keyframes for the balls */
        @keyframes bounce {
            0%, 100% {
                transform: scale(0.0);
            }
            50% {
                transform: scale(1.0);
            }
        }
    </style>
</head>
<body>
    <!-- Sets all the options for the dropdown menu -->
    <div class="glass-container">
        <h1 class="title">Diagnose</h1>
        <select class="dropdown" id="plant-dropdown">
            <option class="inside">Select Plant Type</option>
            <option class="inside">Apple</option>
            <option class="inside">Cherry</option>
            <option class="inside">Corn</option>
            <option class="inside">Grape</option>
            <option class="inside">Peach</option>
            <option class="inside">Bell Pepper</option>
            <option class="inside">Potato</option>
            <option class="inside">Strawberry</option>
            <option class="inside">Tomato</option>
        </select>
        <!-- Creates the image selection area -->
        <input type="file" id="file-input" accept="image/*" style="display: none;" />
        <label for="file-input">
            <div class="box">
                <p class="caption">Drag and drop or select image</p>
            </div>
        </label>
        <!-- Creates the diagnose button -->
        <button class="button" id="diagnose-button">Diagnose</button>
    </div>
    <div class="nav">
        <a class="home" href="/home">Home</a>
        <a class="about" href="/about">About</a>
        <a class="help" href="/help">Help</a>
        <a href="/chat">Chat</a>
    </div>
    <!-- Creates the loading spinner-->
    <div id="loading-spinner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index: 1000;">
        <div class="spinner">
            <div class="double-bounce1"></div>
            <div class="double-bounce2"></div>
        </div>
    </div>
</body>
<!-- App.js implementation -->
<script src="app.js"></script>
</html>
