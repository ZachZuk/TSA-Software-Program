<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Rajdhani:300&display=swap");
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Helvetica", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("fieldd.jpeg");
            background-size: cover;
            background-position: center;
        }

        .glass-container {
            position: relative;
            width: 80%;
            max-width: 70em;
            height: 70%;
            max-height: 45em;
            padding: 2em;
            background: rgba(220, 220, 220, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
        }

        .title {
            /* font-family: 'Times New Roman', Times, serif; */
            padding-top: 3%;
            padding-bottom: 3%;
            padding-left: 6%;
            padding-right: 7%;
            text-align: center;
            margin-left: 18%;
            margin-right: 25%;
            margin-top: 0.2em;
            width: 50%;
            font-weight: bold;
            font-size: 5em;
            margin-bottom: 1em;
            border-radius: 0.5em;
            background-color: rgba(105, 125, 155, 0.3);
        }

        .dropdown {
            padding: 0.5em;
            padding-top: 0.25em;
            padding-bottom: 0.29em;
            border-radius: 0.8em;
            margin-bottom: 0.8em;
            width: 35%;
            font-size: 1.5em;
            font-family: sans-serif;
            font-weight: 550;
            color:rgb(41, 68, 85);
            background-color: lightblue;
            box-shadow: 0 0 15px 3px rgba(173, 216, 230, 0.744), 0 0 30px 20px rgba(99, 131, 154, 0.3) inset;
            border-color: lightblue;
        }

        .inside {
            background-color: rgb(247, 248, 234);
            font-family:'Times New Roman', Times, serif;
        }
        
        .box {
            width: 25em;
            margin: auto;
            margin-bottom: 3.5em;
            padding: 4em;
            height: 12em;
            background-color: rgb(244, 248, 238);
            border-radius: 1.5em;
            border: 0.2em solid black;
            box-sizing: border-box;
        }

        .caption {
            color:rgba(0, 0, 0, 0.4);
            font-size: 1.2em;
        }

        .nav {
            margin-top: 1em;
        }

        .nav a {
            color: white;
            font-size: 1.2em;
            margin: 0 1em;
            text-decoration: none;
        }

        .button {
            height: 14%;
            width: 42%;
            background-color: #0082c3;
            color: white;
            padding: 0.2em;
            border: none;
            cursor: pointer;
            font-size: 3em;
            font-weight: bolder;
            font-family: Helvetica, sans-serif;
            border-radius: 5em;
            box-shadow: 0 0 20px 7px rgb(37, 61, 76);
            text-shadow: 0 0 2px 10px black;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1 class="title">Diagnose</h1>
        <select class="dropdown">
            <option class="inside">Select Plant Type</option>
            <option class="inside">Apple</option>
            <option class="inside">Cherry</option>
            <option class="inside">Corn</option>
            <option class="inside">Grape</option>
            <option class="inside">Peach</option>
            <option class="inside">Bell Pepper</option>
            <option class="inside">Potato</option>
            <option class="inside">Strawberry</option>
            <option class="inside">Tomato</option>
        </select>
            <div class="nav">
            <a class="home" href="home.html" style="color: white; font-size: 1.5em">Home</a>
            <a class="info" href="info.html" style="color: white; font-size: 1.5em">Info</a>
            <a class="about" href="about.html" style="color: white; font-size: 1.5em;">About</a>
        </div>
        <div class="box">
            <p class="caption">Drag and drop or <a href="#">select image</a></p>
        </div>
        <button class="button" onclick="diagnosis(null)">Diagnose</button>
    </div>
</body>
</html>
