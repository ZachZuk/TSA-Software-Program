<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Rajdhani:300&display=swap");
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Helvetica", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("fieldd.jpeg");
            background-size: cover;
            background-position: center;
        }

        .glass-container {
            position: relative;
            width: 80%;
            max-width: 1000px;
            height: 80%;
            max-height: 600px;
            padding: 2em;
            background: rgba(220, 220, 220, 0.2); /* semi-transparent overlay */
            border-radius: 10px;
            backdrop-filter: blur(10px); /* frosted glass effect */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
        }

        .title {
            /* font-family: 'Times New Roman', Times, serif; */
            padding-top: 3%;
            padding-bottom: 3%;
            padding-left: 7%;
            padding-right: 7%;
            text-align: center;
            margin-left: 18%;
            margin-right: 25%;
            width: 50%;
            font-weight: bold;
            font-size: 5em;
            margin-bottom: 0.5em;
            border-radius: 20px;
            background-color: rgba(105, 125, 155, 0.3);
        }

        .dropdown {
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-family: sans-serif;
            font-weight: 550;
            color:rgb(41, 68, 85);
            background-color: lightblue;
            box-shadow: 0 0 15px 3px lightblue, 0 0 30px 20px rgba(99, 131, 154, 0.3) inset;
            border-color: lightblue;
        }

        .inside {
            background-color: rgb(247, 248, 234);
            font-family:'Times New Roman', Times, serif;
        }
        
        .box {
            width: 25em;
            margin: auto;
            padding: 4em;
            height: 12em;
            background-color: aliceblue;
            border-radius: 20px;
            border: 2px solid black;
            box-sizing: border-box;
        }

        .caption {
            color:rgba(0, 0, 0, 0.466);
            font-size: 1.2em;
        }

        .nav {
            margin-top: 1em;
        }

        .nav a {
            color: white;
            font-size: 1.2em;
            margin: 0 1em;
            text-decoration: none;
        }

        .button {
            background-color: #00aaff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 1em;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1 class="title">Diagnose</h1>
        <select class="dropdown">
            <option class="inside">Select Plant Type</option>
            <option class="inside">Apple</option>
            <option class="inside">Cherry</option>
            <option class="inside">Corn</option>
            <option class="inside">Grape</option>
            <option class="inside">Peach</option>
            <option class="inside">Bell Pepper</option>
            <option class="inside">Potato</option>
            <option class="inside">Strawberry</option>
            <option class="inside">Tomato</option>
        </select>
        <div class="box">
            <p class="caption">Drag and drop or <a href="#">select image</a></p>
        </div>
        <button class="button" onclick="diagnosis(null)">Diagnose</button>
        <div class="nav">
            <a class="home" href="home.html">Home</a>
            <a class="info" href="info.html">Info</a>
            <a class="about" href="about.html">About</a>
        </div>
    </div>
</body>
</html>
