<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set character encoding and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets title and icon -->
    <link rel="icon" href="/favicon.ico">
    <title>Chat</title>
    <style>

        /* Reset body and html margin/padding with default font */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Helvetica", sans-serif;
        }

        /* Center everything in body and make background image fullscreen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://stacyknows.com/wp-content/uploads/2022/07/pexels-jahoo-clouseau-388415-scaled.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Centers glass container on the page */
        .glass-container {
            position: absolute;
            width: 80%;
            max-width: 70em;
            height: 70%;
            max-height: 45em;
            padding: 2em;
            padding-top: 0.5em;
            background: rgba(220, 220, 220, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Styles the text input area and centers */
        textarea {
            width: 70%;
            height: 13%;
            max-height: 45em;
            max-width: 70em;
            resize: none;
            border: 3px solid black;
            background: rgba(112, 128, 144, 0.5);
            font-family: "Helvetica", sans-serif;
            font-size: 1.5em;
            padding: 0.5em;
            color: white;
            overflow-y: scroll;
            padding-right: 5px;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        /* Styles the text area to when clicked the background color changes*/
        textarea:focus {
            background: rgba(112, 128, 144, 0.7);
            outline: none;
        }

        /* Styles the place holder text in textarea*/
        textarea::placeholder {
            color: lightgrey;
        }

        /* Customizes the scrollbar width in textarea */
        textarea::-webkit-scrollbar {
            width: 0.3em;
            margin: 6px;
            margin-right: 0.5em;
        }

        /* Styles the background of the scrollbar track */
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Styles the scrollbar thumb */
        textarea::-webkit-scrollbar-thumb {
            background-color: white;
            border-radius: 1em;
            margin-right: 1em;
        }

        /* Styles h1 headers */
        h1 {
            font-size: xx-large;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Styles the sections so it fits in the glass container */
        .section {
            width: 70%;
            height: 70%;
            background: rgba(222, 231, 235, 0.6);
            padding: 20px;
            padding-top: 4px;
            padding-bottom: 12px;
            margin: 14px;
            border-radius: 15px;
            color: rgb(42, 47, 47);
            display: flex;
            justify-content: left;
            align-items: left;
            font-size: x-large;
            overflow-y: scroll;
            text-align: left;
        }

        /* Styles returned text */
        .info-text {
            text-align: left;
            line-height: 1.7em;
        }

        /* Styles links in returned text */
        .info-text a {
            color: rgb(36, 64, 95);
            text-decoration: none;
        }

        /* Adds underline to hovered links in returned text */
        .info-text a:hover {
            text-decoration: underline;
        }

        /* Customizes the scrollbar for Webkit browsers */
        .section::-webkit-scrollbar {
            width: 0.3em;
            margin: 6px;
            margin-right: 0.5em;
        }

        /* Styles the background of scrollbar track */
        .section::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Styles the scrollbar thumb */
        .section::-webkit-scrollbar-thumb {
            background-color: darkslategray;
            border-radius: 1em;
            margin-right: 1em;
        }

        /* Styling for the loading spinner */
        .spinner {
            width: 40px;
            height: 40px;
            position: relative;
            margin: 100px auto;
        }

        /* Styles the bouncing circles in the loading spinner*/
        .double-bounce1, .double-bounce2 {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #333;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.6;
            animation: bounce 2.0s infinite ease-in-out;
        }

        /* Creates an alternating effect for the bouncing balls*/
        .double-bounce2 {
            animation-delay: -1.0s;
        }

        /* Defines the keyframes for the balls */
        @keyframes bounce {
            0%, 100% {
                transform: scale(0.0);
            }
            50% {
                transform: scale(1.0);
            }
        }
        
        /* Nav bar styling*/
        .nav {
            position: absolute;
            justify-content: space-between;
            display: flex;
            top: 0;
            right: 0;
            margin: 8px;
            border-width: 5px;
            gap: 0.5em;
            padding: 0.4em;
            padding-left: 0.6em;
            padding-right: 0.6em;
            border-radius: 0.8em;
            background: rgba(220, 220, 220, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* Styling links inside nav bar */
        .nav a {
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.4em;
            border-radius: 0.5em;
            text-decoration: none;
            font-weight: bold;
            color: white;
        }

        /* Hover effect for nav buttons */
        .nav a:hover {
            background: rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <!-- Creates nav bar -->
    <div class="nav">
        <a class="home" href="{{ url_for('home') }}">Home</a>
        <a class="diagnose" href="{{ url_for('diagnose') }}">Diagnose</a>
        <a class="about" href="{{ url_for('about') }}">About</a>

        <a class="help" href="{{ url_for('help') }}">Help</a>
    </div>
    <!-- Creates glass container -->
    <div class="glass-container">
        <h1 class="title">Chat</h1>
        <textarea id="chat-input" rows="10" placeholder="Describe what is going on (press Enter to diagnose)"></textarea>
        <div class="section">
            <p id="info-text">Write your issues first...</p>
        </div>
    </div>
    <!-- Creates loading spinner -->
    <div id="loading-spinner" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index: 1000;">
        <div class="spinner">
            <div class="double-bounce1"></div>
            <div class="double-bounce2"></div>
        </div>
    </div>
</body>
<script>
    const chatInput = document.getElementById('chat-input');
    const infoText = document.getElementById('info-text');

    function showSpinner() {
        document.getElementById('loading-spinner').style.display = 'block';
    }

    function hideSpinner() {
        document.getElementById('loading-spinner').style.display = 'none';
    }

    chatInput.addEventListener('keydown', async (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            
            const message = chatInput.value.trim();
            if (!message) return;

            infoText.textContent = 'Thinking...';
            showSpinner();
            
            const formData = new FormData();
            formData.append('message', message);

            try {
                const response = await fetch('http://127.0.0.1:5000/generate', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                infoText.innerHTML = data.info;
            } catch (error) {
                console.error('Error:', error);
                infoText.textContent = 'An error occurred while getting the response.';
            }

            chatInput.value = '';
            hideSpinner();
        }
    });
</script>
</html>
